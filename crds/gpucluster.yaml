---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuclusters.dyal.petasus.io
spec:
  group: dyal.petasus.io
  names:
    kind: GpuCluster
    listKind: GpuClusterList
    plural: gpuclusters
    singular: gpucluster
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - fabricKey
            - fabricType
            - sonaNetwork
            properties:
              description:
                type: string
              fabricKey:
                pattern: ^0x[0-9a-fA-F]{1,4}$
                type: string
              fabricType:
                enum:
                - infiniband
                - ethernet
                type: string
              sonaNetwork:
                type: string
    served: true
    storage: true
    additionalPrinterColumns:
    - jsonPath: .spec.fabricKey
      name: Fabric-Key
      type: string
    - jsonPath: .spec.fabricType
      name: Fabric-Type
      type: string
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
