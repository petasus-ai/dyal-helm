---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dyal
  namespace: {{ .Release.Namespace }}
  labels:
    app: dyal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dyal
  template:
    metadata:
      labels:
        app: dyal
    spec:
      serviceAccountName: dyal
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: dyal
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: dyal-config
        - secretRef:
            name: dyal-secret
